# =============================================================================
# BRZRKR — central configuration
# =============================================================================
# Non-secret.  API keys live in .env or environment variables, never here.

project:
  name: brzrkr
  version: 0.2.0
  timezone: UTC

# -- Data -------------------------------------------------------------------
data:
  # Core autonomous trading universe (agent scans these every tick)
  universe:
    # --- Index ETFs (high liquidity, used as regime anchors)
    - SPY       # S&P 500
    - QQQ       # Nasdaq-100
    - IWM       # Russell 2000 (small-cap proxy)
    - DIA       # Dow Jones
    # --- Sector rotation ETFs
    - XLK       # Technology
    - XLF       # Financials
    - XLE       # Energy
    - XLV       # Health Care
    # --- Commodity / macro ETFs (futures proxies — Alpaca equities feed)
    - GLD       # Gold  (/GC proxy)
    - SLV       # Silver (/SI proxy)
    - USO       # Crude oil (/CL proxy)
    - TLT       # 20yr Treasury (/ZB proxy)
    # --- Leveraged (high-beta tactical)
    - TQQQ      # 3× QQQ long
    - SQQQ      # 3× QQQ short
    # --- High-beta individual stocks
    - NVDA
    - TSLA
    - AAPL
    - MSFT
    - META
    - AMD
    # --- Crypto ETFs (Bitcoin/Ethereum on Alpaca equities)
    - IBIT      # BlackRock Bitcoin ETF
    - GBTC      # Grayscale Bitcoin Trust
    # ------------------------------------------------------------------
    # True futures (/ES /NQ /CL /GC) require a CME-connected data feed
    # such as Polygon, Databento, or Tradier. Alpaca's stock endpoint
    # does NOT serve them.  Uncomment + wire in a futures adapter first.
    # - ES
    # - NQ
    # - CL
    # - GC
    # ------------------------------------------------------------------
    # Crypto perpetuals trade 24/7 via Alpaca's crypto endpoint
    # (separate API base URL: data.alpaca.markets/v1beta3/crypto).
    # Enable by setting ALPACA_CRYPTO=true and using CryptoDataClient.
    # - BTC/USD
    # - ETH/USD
    # - SOL/USD

  lookback_days: 365          # 365 calendar days → ~252 trading days; seq_len=60 needs only 60
  bar_timeframe: 1Day
  macro_series:
    - DGS10     # 10y Treasury yield
    - VIXCLS    # VIX
    - DFF       # Effective Fed Funds rate
    - UNRATE
  news_query: "stock market OR Federal Reserve OR earnings OR inflation"

  # --- Enhanced data sources (Phase 1) ---
  use_congress_data: true           # Enable congressional trade tracking
  congress_lookback_days: 60
  congress_min_amount: 1000         # Minimum trade amount to consider
  use_news_sentiment: true          # Enable FinBERT news sentiment
  news_sources:
    - rss
    - google_news
    - alpha_vantage
    - finnhub
  sentiment_lookback_days: 7
  use_reddit_sentiment: true
  reddit_subs: ["wallstreetbets", "stocks", "options", "investing"]

  # --- Ticker → Futures mapping for congressional trades ---
  ticker_to_futures_map:
    # Tech heavy
    AAPL: NQ
    MSFT: NQ
    NVDA: NQ
    META: NQ
    GOOGL: NQ
    GOOG: NQ
    AMD: NQ
    # Financials
    JPM: ZB
    BAC: ZB
    GS: ZB
    MS: ZB
    # Energy
    XOM: CL
    CVX: CL
    COP: CL
    # Materials
    FCX: HG
    NEM: GC
    # Broad market
    SPY: ES
    QQQ: NQ
    IWM: RTY
    DIA: YM

model:
  seq_len: 60    # 60 trading-day window; Alpaca 365-day lookback yields ~252 trading bars
  transformer:
    d_model: 128
    n_heads: 8
    n_layers: 3
    dropout: 0.1
  ensemble_weights:
    lstm: 0.25         # reduced to make room for RL
    xgboost: 0.35      # reduced to make room for RL
    transformer: 0.25  # reduced to make room for RL
    rl: 0.15           # PPO agent — trained, wired at 15%
  checkpoints_dir: models/

# -- Signals ----------------------------------------------------------------
signals:
  # 0.75 is the data-driven threshold:
  #   long  win_rate=66.7% at this level → EV = +0.996 R/trade
  #   short win_rate=21.1% → -0.371 R/trade → blocked by side_bias in bull regimes
  confidence_threshold: 0.75
  output_format: json
  output_dir: data/signals/

# -- Risk -------------------------------------------------------------------
risk:
  max_position_pct: 0.06         # 6% of equity per trade — 8 slots × 6% = 48% max exposure
  base_risk_pct: 0.01            # risk 1% of equity per trade — fixed-fraction sizing
  kelly_fraction: 0.5            # kept for back-compat; Kelly online sizing kicks in at 30+ trades
  default_atr_mult_stop: 2.0
  default_tp_rr: 2.0             # data-driven: learned_params.json optimal_rr=2.0 from 214k trades
  correlation_limit: 0.70
  vix_crisis_level: 35.0
  realized_vol_crisis: 0.04      # synced with risk_manager.py (was 0.12 in code — fixed)
  max_drawdown_pct: 0.15
  blackout_windows_utc:
    - { start: "13:30", end: "13:35", description: "us_open" }
    - { start: "19:55", end: "20:00", description: "us_close" }

# -- Sessions ---------------------------------------------------------------
sessions:
  # Extended hours allows pre-market (04:00–09:30 ET) and
  # after-hours (16:00–20:00 ET) trading via Alpaca limit orders.
  # NOTE: bracket orders are NOT supported in extended hours.
  # The agent falls back to plain limit entries; manual SL/TP required.
  extended_hours_enabled: false

  # Crypto trades 24/7 — enable separately when CryptoDataClient is wired
  crypto_enabled: false

  # Which sessions the agent is allowed to enter new positions in:
  #   regular       — 09:30–16:00 ET  (always on)
  #   pre_market    — 04:00–09:30 ET  (requires extended_hours_enabled)
  #   after_hours   — 16:00–20:00 ET  (requires extended_hours_enabled)
  allowed_sessions:
    - regular

# -- NinjaTrader / Apex Trader Funding --------------------------------------
# Switch broker: alpaca → ninja when you hit the paper trading milestone.
# Set NINJA_ACCOUNT, NINJA_ATI_HOST, NINJA_ATI_PORT, APEX_TIER in .env
ninja:
  host: "127.0.0.1"
  port: 36973
  default_account: "Sim101"      # change to your Apex account ID
  apex_tier: "50k"               # 25k / 50k / 100k / 150k / 250k
  heartbeat_interval_s: 10
  reconnect_delay_s: 3
  # Apex-specific instrument universe (futures only)
  futures_universe:
    - MES    # Micro E-mini S&P 500   ($5/pt) — safest for eval
    - MNQ    # Micro E-mini Nasdaq    ($2/pt)
    - ES     # E-mini S&P 500         ($50/pt)
    - NQ     # E-mini Nasdaq-100      ($20/pt)
    - CL     # Crude oil              ($1,000/pt)
    - GC     # Gold                   ($100/pt)
    - RTY    # E-mini Russell 2000    ($50/pt)

# -- Live trading -----------------------------------------------------------
live:
  broker: alpaca               # change to: ninja  when paper target hit
  account_equity_floor_usd: 25000
  initial_account_equity_usd: 100000
  max_positions: 8               # raised from 5 — more active, better diversification

# -- Learning ---------------------------------------------------------------
learning:
  # How many new closed trades before the online learner reruns
  online_learner_min_new_trades: 5
  # How many trades to include in each refit window
  online_learner_lookback: 200
  # Regime detector refresh interval (minutes)
  regime_refresh_minutes: 60

# -- Logging ----------------------------------------------------------------
logging:
  level: INFO
  log_path: trading_enhancer.log
  max_bytes: 10485760            # 10 MB
  backups: 5
